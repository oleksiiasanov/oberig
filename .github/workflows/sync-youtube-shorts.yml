name: Sync YouTube shorts

on:
  workflow_dispatch:
  schedule:
    - cron: "37 2 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync shorts from YouTube
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CHANNEL_ID: ${{ vars.YT_CHANNEL_ID }}
          YT_HANDLE: ${{ vars.YT_HANDLE }}
          YT_PLAYLIST_ID: ${{ vars.YT_PLAYLIST_ID }}
          YT_SHORTS_LIMIT: ${{ vars.YT_SHORTS_LIMIT }}
          YT_MAX_DURATION_SECONDS: ${{ vars.YT_MAX_DURATION_SECONDS }}
          YT_SYNC_STRICT: "1"
        run: npm run sync:shorts

      - name: Commit generated reels
        run: |
          if git diff --quiet -- src/data/reels.generated.json; then
            echo "Shorts are already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/reels.generated.json
          git commit -m "chore: sync YouTube shorts"
          git push
